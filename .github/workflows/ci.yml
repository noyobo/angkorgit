name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: |
      github.event_name != 'pull_request' || (
        github.event.pull_request.draft == false &&
        contains(github.event.pull_request.labels.*.name, 'ci')
      )
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      e2e: ${{ steps.select.outputs.e2e }}
      rust: ${{ steps.select.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - name: Full suite on main push or manual dispatch
        id: force
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: echo "full=true" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.force.outputs.full != 'true'
        with:
          filters: |
            frontend:
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'apps/desktop/rspack.config.*'
              - 'apps/desktop/tsconfig*'
              - 'apps/desktop/tailwind.config.*'
              - 'apps/desktop/postcss.config.*'
              - 'packages/**'
              - 'tests/unit/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'biome.json*'
            e2e:
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'apps/desktop/rspack.config.*'
              - 'apps/desktop/tsconfig*'
              - 'apps/desktop/tailwind.config.*'
              - 'apps/desktop/postcss.config.*'
              - 'packages/**'
              - 'tests/e2e/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
            rust:
              - 'apps/desktop/src-tauri/**'
            ci:
              - '.github/workflows/ci.yml'
      - name: Select jobs
        id: select
        run: |
          if [ "${{ steps.force.outputs.full }}" = "true" ] || [ "${{ steps.filter.outputs.ci }}" = "true" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "Selection: full suite"
          else
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "e2e=${{ steps.filter.outputs.e2e }}" >> "$GITHUB_OUTPUT"
            echo "rust=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
            echo "Selection: frontend=${{ steps.filter.outputs.frontend }} e2e=${{ steps.filter.outputs.e2e }} rust=${{ steps.filter.outputs.rust }}"
          fi

  web-pipeline:
    name: Web Pipeline
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      
      # 1. Format (fastest, fail early)
      - name: Format
        run: bun run format:check
      
      # 2-3. Typecheck & Unit Tests (all parallel)
      - name: Typecheck and Unit Tests
        run: |
          # Typecheck in parallel
          bun run --filter '@angkorgit/core' typecheck &
          bun run --filter '@angkorgit/design-system' typecheck &
          bun run --filter '@angkorgit/desktop' typecheck &
          
          # Unit tests in parallel
          bun test tests/unit/graphLayout.test.ts tests/unit/wordDiff.test.ts tests/unit/conflicts.test.ts tests/unit/fileFilter.test.ts &
          bun test tests/unit/ai*.test.ts tests/unit/forge.test.ts tests/unit/pullRequestUrl.test.ts &
          bun test tests/unit/commitStyle.test.ts tests/unit/highlight.test.ts tests/unit/worktree.test.ts tests/unit/workspace.test.ts &
          
          # Wait for all background jobs to complete
          wait
      
      # 4. Build
      - name: Build
        run: bun --filter @angkorgit/desktop build
      
      # 5. E2E (if needed)
      - name: Cache Playwright
        if: needs.changes.outputs.e2e == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ${{ github.workspace }}/.ms-playwright
          key: playwright-${{ runner.os }}-v1.63.0
          restore-keys: |
            playwright-${{ runner.os }}-
      
      - name: Install Playwright
        if: needs.changes.outputs.e2e == 'true'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi
      
      - name: E2E Tests
        if: needs.changes.outputs.e2e == 'true'
        run: |
          cd apps/desktop/dist
          python3 -m http.server 1420 &
          SERVER_PID=$!
          cd ../../..
          
          echo "Waiting for server..."
          for i in {1..30}; do
            if curl -s http://localhost:1420 > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
          
          bun run test:e2e
          kill $SERVER_PID || true

  rust-lint:
    name: Rust Lint
    needs: [changes, web-pipeline]
    if: |
      always() &&
      needs.changes.outputs.rust == 'true' &&
      (needs.changes.outputs.frontend != 'true' || needs.web-pipeline.result == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: git-engine
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  rust-test:
    name: Rust Tests (${{ matrix.os }})
    needs: [changes, rust-lint]
    if: |
      always() &&
      needs.changes.outputs.rust == 'true' &&
      needs.rust-lint.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: git-engine
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: cargo test --locked

  ci:
    name: CI
    if: |
      always() &&
      needs.changes.result != 'skipped' &&
      needs.changes.result != 'cancelled'
    needs: [changes, web-pipeline, rust-lint, rust-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected jobs
        env:
          WANT_WEB: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true' }}
          WANT_RUST: ${{ needs.changes.outputs.rust }}
          WEB_PIPELINE: ${{ needs.web-pipeline.result }}
          RUST_LINT: ${{ needs.rust-lint.result }}
          RUST_TEST: ${{ needs.rust-test.result }}
        run: |
          fail=0
          require() {
            local want=$1 result=$2 label=$3
            if [ "$want" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::$label was required but finished as '$result'"
                fail=1
              else
                echo "$label ok"
              fi
            else
              echo "$label skipped (not selected)"
            fi
          }
          require "$WANT_WEB" "$WEB_PIPELINE" "web-pipeline"
          require "$WANT_RUST" "$RUST_LINT" "rust-lint"
          require "$WANT_RUST" "$RUST_TEST" "rust-test"
          exit "$fail"
