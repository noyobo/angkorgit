name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: |
      github.event_name != 'pull_request' || (
        github.event.pull_request.draft == false &&
        contains(github.event.pull_request.labels.*.name, 'ci')
      )
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      e2e: ${{ steps.select.outputs.e2e }}
      rust: ${{ steps.select.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - name: Full suite on main push or manual dispatch
        id: force
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: echo "full=true" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.force.outputs.full != 'true'
        with:
          filters: |
            frontend:
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'apps/desktop/rspack.config.*'
              - 'apps/desktop/tsconfig*'
              - 'apps/desktop/tailwind.config.*'
              - 'apps/desktop/postcss.config.*'
              - 'packages/**'
              - 'tests/unit/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'biome.json*'
            e2e:
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'apps/desktop/rspack.config.*'
              - 'apps/desktop/tsconfig*'
              - 'apps/desktop/tailwind.config.*'
              - 'apps/desktop/postcss.config.*'
              - 'packages/**'
              - 'tests/e2e/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
            rust:
              - 'apps/desktop/src-tauri/**'
            ci:
              - '.github/workflows/ci.yml'
      - name: Select jobs
        id: select
        run: |
          if [ "${{ steps.force.outputs.full }}" = "true" ] || [ "${{ steps.filter.outputs.ci }}" = "true" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "Selection: full suite"
          else
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "e2e=${{ steps.filter.outputs.e2e }}" >> "$GITHUB_OUTPUT"
            echo "rust=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
            echo "Selection: frontend=${{ steps.filter.outputs.frontend }} e2e=${{ steps.filter.outputs.e2e }} rust=${{ steps.filter.outputs.rust }}"
          fi

  format-check:
    name: Format (Biome)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  typecheck-packages:
    name: Typecheck (Packages)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@angkorgit/core' typecheck
      - run: bun run --filter '@angkorgit/design-system' typecheck

  typecheck-desktop:
    name: Typecheck (Desktop)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@angkorgit/desktop' typecheck

  test-core:
    name: Unit Tests (Core Logic)
    needs: [changes, typecheck-packages]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.typecheck-packages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun test tests/unit/graphLayout.test.ts tests/unit/wordDiff.test.ts tests/unit/conflicts.test.ts tests/unit/fileFilter.test.ts

  test-ai:
    name: Unit Tests (AI & Integrations)
    needs: [changes, typecheck-packages]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.typecheck-packages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun test tests/unit/ai*.test.ts tests/unit/forge.test.ts tests/unit/pullRequestUrl.test.ts

  test-utils:
    name: Unit Tests (Utilities)
    needs: [changes, typecheck-packages]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.typecheck-packages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun test tests/unit/commitStyle.test.ts tests/unit/highlight.test.ts tests/unit/worktree.test.ts tests/unit/workspace.test.ts

  build:
    name: Build
    needs: [changes, typecheck-desktop, test-core, test-ai, test-utils]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.typecheck-desktop.result == 'success' &&
      needs.test-core.result == 'success' &&
      needs.test-ai.result == 'success' &&
      needs.test-utils.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun --filter @angkorgit/desktop build
      - name: Upload desktop dist for e2e
        if: needs.changes.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: apps/desktop/dist
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E Tests (Rstest)
    needs: [changes, build]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.e2e == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ${{ github.workspace }}/.ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Download desktop dist
        uses: actions/download-artifact@v4
        with:
          name: desktop-dist
          path: apps/desktop/dist
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi
      - name: Serve production build and run tests
        run: |
          # IMPORTANT: Use production build, NOT dev server
          # Rspack lazy compilation in dev mode causes 404s and MIME type errors in CI
          # See docs/E2E-TESTING.md for details
          cd apps/desktop/dist
          python3 -m http.server 1420 &
          SERVER_PID=$!
          cd ../../..
          
          echo "Waiting for server..."
          for i in {1..30}; do
            if curl -s http://localhost:1420 > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done
          
          bun run test:e2e
          kill $SERVER_PID || true

  rust-lint:
    name: Rust Lint
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: git-engine
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  rust-test:
    name: Rust Tests (${{ matrix.os }})
    needs: [changes, rust-lint]
    if: |
      always() &&
      needs.changes.outputs.rust == 'true' &&
      needs.rust-lint.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: git-engine
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: cargo test --locked

  ci:
    name: CI
    if: |
      always() &&
      needs.changes.result != 'skipped' &&
      needs.changes.result != 'cancelled'
    needs: [changes, format-check, typecheck-packages, typecheck-desktop, test-core, test-ai, test-utils, build, e2e, rust-lint, rust-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected jobs
        env:
          WANT_FRONTEND: ${{ needs.changes.outputs.frontend }}
          WANT_E2E: ${{ needs.changes.outputs.e2e }}
          WANT_RUST: ${{ needs.changes.outputs.rust }}
          FORMAT_CHECK: ${{ needs.format-check.result }}
          TYPECHECK_PKG: ${{ needs.typecheck-packages.result }}
          TYPECHECK_DESKTOP: ${{ needs.typecheck-desktop.result }}
          TEST_CORE: ${{ needs.test-core.result }}
          TEST_AI: ${{ needs.test-ai.result }}
          TEST_UTILS: ${{ needs.test-utils.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          RUST_LINT: ${{ needs.rust-lint.result }}
          RUST_TEST: ${{ needs.rust-test.result }}
        run: |
          fail=0
          require() {
            local want=$1 result=$2 label=$3
            if [ "$want" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::$label was required but finished as '$result'"
                fail=1
              else
                echo "$label ok"
              fi
            else
              echo "$label skipped (not selected)"
            fi
          }
          require "$WANT_FRONTEND" "$FORMAT_CHECK" "format-check"
          require "$WANT_FRONTEND" "$TYPECHECK_PKG" "typecheck-packages"
          require "$WANT_FRONTEND" "$TYPECHECK_DESKTOP" "typecheck-desktop"
          require "$WANT_FRONTEND" "$TEST_CORE" "test-core"
          require "$WANT_FRONTEND" "$TEST_AI" "test-ai"
          require "$WANT_FRONTEND" "$TEST_UTILS" "test-utils"
          require "$WANT_FRONTEND" "$BUILD" "build"
          require "$WANT_E2E" "$E2E" "e2e"
          require "$WANT_RUST" "$RUST_LINT" "rust-lint"
          require "$WANT_RUST" "$RUST_TEST" "rust-test"
          exit "$fail"
